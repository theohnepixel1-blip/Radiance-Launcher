def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def discordProperties = new Properties()
def discordPropertiesFile = rootProject.file('discord.properties')
if (discordPropertiesFile.exists()) {
    discordPropertiesFile.withInputStream { discordProperties.load(it) }
}
def discordApplicationId = providers.gradleProperty('discord.application_id')
        .getOrElse(discordProperties.getProperty('application_id', '0')).trim()
if (!(discordApplicationId ==~ /[0-9]+/) ||
        new BigInteger(discordApplicationId) > BigInteger.valueOf(Long.MAX_VALUE)) {
    throw new GradleException('discord.application_id must be a numeric Discord Application ID, or 0 to disable the integration.')
}
discordApplicationId = new BigInteger(discordApplicationId).toString()
def discordLargeImage = providers.gradleProperty('discord.large_image')
        .getOrElse(discordProperties.getProperty('large_image', '')).trim()

def getGitTag() {
    def tag = "unknown"
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
        tag = stdout.toString().trim()
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
    } catch (ignored) {
    }
    return tag
}

static def getVersionCodeByTimestamp() {
    def baseDate = Date.parse("yyyy-MM-dd HH:mm:ss", "2025-01-01 00:00:00")
    def now = new Date()
    def diff = (now.time - baseDate.time) / 1000
    return diff.toInteger()
}

android {
    namespace 'org.levimc.launcher'
    compileSdk 35

    defaultConfig {
        applicationId "org.levimc.launcher"
        minSdk 28
        targetSdk 35
        versionCode getVersionCodeByTimestamp()
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        resValue "string", "app_name", "Radiance"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }
}


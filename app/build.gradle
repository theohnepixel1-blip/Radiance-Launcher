plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.firebase.crashlytics) apply false
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def discordProperties = new Properties()
def discordPropertiesFile = rootProject.file('discord.properties')
if (discordPropertiesFile.exists()) {
    discordPropertiesFile.withInputStream { discordProperties.load(it) }
}
def discordApplicationId = providers.gradleProperty('discord.application_id')
        .getOrElse(discordProperties.getProperty('application_id', '0')).trim()
if (!(discordApplicationId ==~ /[0-9]+/) ||
        new BigInteger(discordApplicationId) > BigInteger.valueOf(Long.MAX_VALUE)) {
    throw new GradleException('discord.application_id must be a numeric Discord Application ID, or 0 to disable the integration.')
}
discordApplicationId = new BigInteger(discordApplicationId).toString()
def discordLargeImage = providers.gradleProperty('discord.large_image')
        .getOrElse(discordProperties.getProperty('large_image', '')).trim()

def discordAar = file('libs/discord_partner_sdk.aar')
def discordSdkPresent = discordAar.exists()
if (!discordSdkPresent) {
    logger.warn('app/libs/discord_partner_sdk.aar was not found. Discord rich presence is disabled for this build.')
    discordApplicationId = '0'
    discordLargeImage = ''
}

def hasGoogleServices = file('google-services.json').exists()
if (hasGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.warn('app/google-services.json was not found. Firebase upload is disabled for this build.')
}

def uploadCrashlytics = hasGoogleServices && providers.gradleProperty('crashlytics.upload').getOrElse('true') == 'true'

def getGitTag() {
    def tag = "unknown"
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
        tag = stdout.toString().trim()
        if (tag.startsWith("v")) {
            tag = tag.substring(1)
        }
    } catch (ignored) {
    }
    return tag
}

static def getVersionCodeByTimestamp() {
    def baseDate = Date.parse("yyyy-MM-dd HH:mm:ss", "2025-01-01 00:00:00")
    def now = new Date()
    def diff = (now.time - baseDate.time) / 1000
    return diff.toInteger()
}

android {
    namespace 'org.levimc.launcher'
    compileSdkVersion 36
    defaultConfig {
        applicationId "org.levimc.launcher"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode getVersionCodeByTimestamp()
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CURSEFORGE_API_KEY", "\"${localProperties.getProperty('curseforge.api_key', '')}\""
        buildConfigField 'long', 'DISCORD_APPLICATION_ID', "${discordApplicationId}L"
        buildConfigField 'String', 'DISCORD_LARGE_IMAGE', groovy.json.JsonOutput.toJson(discordLargeImage)
        resValue "string", "app_name", "Radiance"
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    buildFeatures {
        viewBinding true
    }
    buildFeatures {
        prefab true
    }
    buildFeatures {
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDirs += rootProject.file('resources')
            if (!discordSdkPresent) {
                java.srcDirs += 'src/discordStub/java'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasGoogleServices) {
                firebaseCrashlytics {
                    mappingFileUploadEnabled uploadCrashlytics
                    nativeSymbolUploadEnabled uploadCrashlytics
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        debug {
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasGoogleServices) {
                firebaseCrashlytics {
                    mappingFileUploadEnabled uploadCrashlytics
                    nativeSymbolUploadEnabled uploadCrashlytics
                }
            }
            ndk {
                debugSymbolLevel 'FULL'
            }
            buildConfigField "boolean", "IS_BETA", "false"
        }
        beta {
            initWith release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasGoogleServices) {
                firebaseCrashlytics {
                    mappingFileUploadEnabled uploadCrashlytics
                    nativeSymbolUploadEnabled uploadCrashlytics
                }
            }
            resValue "string", "app_name", "Radiance Beta"
            buildConfigField "boolean", "IS_BETA", "true"
            matchingFallbacks = ["release"]
            ndk {
                debugSymbolLevel 'FULL'
            }
        }

    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += [
                    "**/libpreloader.so",
                    "**/libgxcore.so",
                    "**/libinbuiltmods.so"
            ]
        }
        resources.excludes += [
                "DebugProbesKt.bin"
        ]

        resources.pickFirsts += [
                "META-INF/INDEX.LIST",
                "META-INF/DEPENDENCIES",
                "META-INF/io.netty.versions.properties"
        ]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    ndkVersion = "28.2.13676358"
}

